---
layout: default
---
<div class="docs-container">
  <aside class="docs-sidebar">
    {% include sidebar.html %}
  </aside>
  <article class="docs-content">
    <header class="docs-header">
      {% if page.category %}
        <span class="docs-category">{{ page.category }}</span>
      {% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p class="docs-lead">{{ page.description }}</p>
      {% endif %}
      {% if page.updated %}
        <p class="docs-meta">Updated {{ page.updated }}</p>
      {% endif %}
    </header>
    <div class="docs-body">
      {{ content }}
    </div>
  </article>
</div>
