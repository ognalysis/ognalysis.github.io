# Scripts
## Find Files with non-ascii characters
<code id="1">Loading file...</code>
<script>
   var a = "1"
       fetch('https://raw.githubusercontent.com/ognalysis/Scriptlets/refs/heads/main/Find-Files-with-non-ascii-chars.ps1')
           .then(response => {
               console.log(response)
               return response.text() //this gonna extract the content of the file
           })
           .then(data => {document.getElementById(a).textContent = data;})
           .catch(error => {document.getElementById(a).textContent = `Error loading file: ${error}`;});
</script>
</br></br>
